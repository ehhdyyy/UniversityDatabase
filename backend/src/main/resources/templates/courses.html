<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Courses - University Database</title>
    <link rel="stylesheet" type="text/css" th:href="@{/style.css}">
</head>
<body>
    <div class="container">
        <h1>📚 Courses List</h1>
        <p>All available courses in the system</p>
        
        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
        
        <div class="crud-controls">
            <a href="/courses/add" class="btn-add">➕ Add Course</a>
        </div>

        <div class="filter-section">
            <form class="filter-form" action="/courses" method="get">
                <div>
                    <label>Search Course:</label>
                    <input type="text" name="search" placeholder="Enter course name..." th:value="${param.search}">
                </div>
                <button type="submit" class="btn-filter">🔍 Search</button>
                <a href="/courses" class="btn-reset">↻ Reset</a>
            </form>
        </div>
        
        <table>
            <thead>
                <tr>
                    <th>Course ID</th>
                    <th>Course Name</th>
                    <th>Description</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="course : ${courses}">
                    <td th:text="${course.courseID}"></td>
                    <td th:text="${course.courseName}"></td>
                    <td th:text="${course.description}"></td>
                    <td>
                        <div class="action-buttons">
                            <a th:href="@{/courses/edit/{id}(id=${course.courseID})}" class="btn-edit">✏️ Edit</a>
                            <form th:action="@{/courses/delete/{id}(id=${course.courseID})}" method="post" style="display: inline;"
                                  onsubmit="return confirm('Are you sure you want to delete this course?');">
                                <button type="submit" class="btn-delete">🗑️ Delete</button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
        
        <p class="data-count" th:text="'Total Courses: ' + ${courses.size()}"></p>
        
        <footer>
            <a href="/">← Back to Home</a>
        </footer>
    </div>
</body>
</html>
