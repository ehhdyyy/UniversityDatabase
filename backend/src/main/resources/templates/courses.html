<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Courses - University Database</title>
    <link rel="stylesheet" type="text/css" th:href="@{/style.css}">
</head>
<body>
    <div class="container">
        <h1>📚 Courses List</h1>
        <p>All available courses in the system</p>
        
        <table>
            <thead>
                <tr>
                    <th>Course ID</th>
                    <th>Course Name</th>
                    <th>Description</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="course : ${courses}">
                    <td th:text="${#strings.substringBefore(course, ' ')}"></td>
                    <td th:text="${#strings.substringBefore(#strings.substringAfter(course, ' '), ' ')}"></td>
                    <td th:text="${#strings.substringAfter(#strings.substringAfter(course, ' '), ' ')}"></td>
                </tr>
            </tbody>
        </table>
        
        <p class="data-count" th:text="'Total Courses: ' + ${courses.size()}"></p>
        
        <footer>
            <a href="/">← Back to Home</a>
        </footer>
    </div>
</body>
</html>
