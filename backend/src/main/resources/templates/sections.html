<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Sections - University Database</title>
    <link rel="stylesheet" type="text/css" th:href="@{/style.css}">
</head>
<body>
    <div class="container">
        <h1>🏫 Sections List</h1>
        <p>All course sections with schedules</p>
        
        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
        
        <div class="crud-controls">
            <a href="/sections/add" class="btn-add">➕ Add Section</a>
        </div>

        <div class="filter-section">
            <form class="filter-form" action="/sections" method="get">
                <div>
                    <label>Filter by Course ID:</label>
                    <input type="number" name="courseId" placeholder="Enter course ID..." th:value="${param.courseId}">
                </div>
                <div>
                    <label>Filter by Term:</label>
                    <select name="term">
                        <option value="">All Terms</option>
                        <option value="Fall 2024" th:selected="${param.term == 'Fall 2024'}">Fall 2024</option>
                        <option value="Spring 2025" th:selected="${param.term == 'Spring 2025'}">Spring 2025</option>
                        <option value="Spring 2026" th:selected="${param.term == 'Spring 2026'}">Spring 2026</option>
                    </select>
                </div>
                <button type="submit" class="btn-filter">🔍 Filter</button>
                <a href="/sections" class="btn-reset">↻ Reset</a>
            </form>
        </div>
        
        <table>
            <thead>
                <tr>
                    <th>Section ID</th>
                    <th>Course ID</th>
                    <th>Course Name</th>
                    <th>Schedule</th>
                    <th>Term</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="section : ${sections}">
                    <td th:text="${section.sectionID}"></td>
                    <td th:text="${section.courseID}"></td>
                    <td th:text="${section.courseName}"></td>
                    <td th:text="${section.dayTime}"></td>
                    <td th:text="${section.term}"></td>
                    <td>
                        <div class="action-buttons">
                            <a th:href="@{/sections/edit/{id}(id=${section.sectionID})}" class="btn-edit">✏️ Edit</a>
                            <form th:action="@{/sections/delete/{id}(id=${section.sectionID})}" method="post" style="display: inline;"
                                  onsubmit="return confirm('Are you sure you want to delete this section?');">
                                <button type="submit" class="btn-delete">🗑️ Delete</button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
        
        <p class="data-count" th:text="'Total Sections: ' + ${sections.size()}"></p>
        
        <footer>
            <a href="/">← Back to Home</a>
        </footer>
    </div>
</body>
</html>
