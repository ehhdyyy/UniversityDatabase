<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Sections - University Database</title>
    <link rel="stylesheet" type="text/css" th:href="@{/style.css}">
</head>
<body>
    <div class="container">
        <h1>🏫 Sections List</h1>
        <p>All course sections with schedules</p>
        
        <table>
            <thead>
                <tr>
                    <th>Section ID</th>
                    <th>Course ID</th>
                    <th>Course Name</th>
                    <th>Schedule</th>
                    <th>Term</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="section : ${sections}">
                    <td th:text="${#strings.arraySplit(section, ' ')[0]}"></td>
                    <td th:text="${#strings.arraySplit(section, ' ')[1]}"></td>
                    <td th:text="${#strings.arraySplit(section, ' ')[2]}"></td>
                    <td th:text="${#strings.arraySplit(section, ' ')[3]}"></td>
                    <td th:text="${#strings.arraySplit(section, ' ')[4]}"></td>
                </tr>
            </tbody>
        </table>
        
        <p class="data-count" th:text="'Total Sections: ' + ${sections.size()}"></p>
        
        <footer>
            <a href="/">← Back to Home</a>
        </footer>
    </div>
</body>
</html>
