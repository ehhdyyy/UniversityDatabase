<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Enrollments - University Database</title>
    <link rel="stylesheet" type="text/css" th:href="@{/style.css}">
</head>
<body>
    <div class="container">
        <h1>📝 Enrollments List</h1>
        <p>All student enrollments in sections</p>
        
        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
        
        <div class="crud-controls">
            <a href="/enrollments/add" class="btn-add">➕ Add Enrollment</a>
        </div>

        <div class="filter-section">
            <form class="filter-form" action="/enrollments" method="get">
                <div>
                    <label>Filter by Student ID:</label>
                    <input type="number" name="studentId" placeholder="Enter student ID..." th:value="${param.studentId}">
                </div>
                <div>
                    <label>Filter by Section ID:</label>
                    <input type="number" name="sectionId" placeholder="Enter section ID..." th:value="${param.sectionId}">
                </div>
                <button type="submit" class="btn-filter">🔍 Filter</button>
                <a href="/enrollments" class="btn-reset">↻ Reset</a>
            </form>
        </div>
        
        <table>
            <thead>
                <tr>
                    <th>Enrollment ID</th>
                    <th>Student ID</th>
                    <th>Student Name</th>
                    <th>Section ID</th>
                    <th>Course</th>
                    <th>Schedule</th>
                    <th>Term</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="enrollment : ${enrollments}">
                    <td th:text="${enrollment.enrollmentID}"></td>
                    <td th:text="${enrollment.studentID}"></td>
                    <td th:text="${enrollment.studentName}"></td>
                    <td th:text="${enrollment.sectionID}"></td>
                    <td th:text="${enrollment.courseName}"></td>
                    <td th:text="${enrollment.dayTime}"></td>
                    <td th:text="${enrollment.term}"></td>
                    <td>
                        <div class="action-buttons">
                            <a th:href="@{/enrollments/edit/{id}(id=${enrollment.enrollmentID})}" class="btn-edit">✏️ Edit</a>
                            <form th:action="@{/enrollments/delete/{id}(id=${enrollment.enrollmentID})}" method="post" style="display: inline;"
                                  onsubmit="return confirm('Are you sure you want to delete this enrollment?');">
                                <button type="submit" class="btn-delete">🗑️ Delete</button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
        
        <p class="data-count" th:text="'Total Enrollments: ' + ${enrollments.size()}"></p>
        
        <footer>
            <a href="/">← Back to Home</a>
        </footer>
    </div>
</body>
</html>
