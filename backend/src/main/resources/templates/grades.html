<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Grades - University Database</title>
    <link rel="stylesheet" type="text/css" th:href="@{/style.css}">
</head>
<body>
    <div class="container">
        <h1>🎓 Grades List</h1>
        <p>All student grades and performance</p>
        
        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
        
        <div class="crud-controls">
            <a href="/grades/add" class="btn-add">➕ Add Grade</a>
        </div>

        <div class="filter-section">
            <form class="filter-form" action="/grades" method="get">
                <div>
                    <label>Filter by Student Name:</label>
                    <input type="text" name="studentName" placeholder="Enter student name..." th:value="${param.studentName}">
                </div>
                <div>
                    <label>Filter by Grade:</label>
                    <select name="grade">
                        <option value="">All Grades</option>
                        <option value="A" th:selected="${param.grade == 'A'}">A</option>
                        <option value="A-" th:selected="${param.grade == 'A-'}">A-</option>
                        <option value="B+" th:selected="${param.grade == 'B+'}">B+</option>
                        <option value="B" th:selected="${param.grade == 'B'}">B</option>
                        <option value="B-" th:selected="${param.grade == 'B-'}">B-</option>
                        <option value="C+" th:selected="${param.grade == 'C+'}">C+</option>
                        <option value="C" th:selected="${param.grade == 'C'}">C</option>
                    </select>
                </div>
                <button type="submit" class="btn-filter">🔍 Filter</button>
                <a href="/grades" class="btn-reset">↻ Reset</a>
            </form>
        </div>
        
        <table>
            <thead>
                <tr>
                    <th>Grade ID</th>
                    <th>Enrollment ID</th>
                    <th>Student Name</th>
                    <th>Grade</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="gradeEntry : ${grades}">
                    <td th:text="${gradeEntry.gradeID}"></td>
                    <td th:text="${gradeEntry.enrollmentID}"></td>
                    <td th:text="${gradeEntry.studentName}"></td>
                    <td th:text="${gradeEntry.grade}"></td>
                    <td>
                        <div class="action-buttons">
                            <a th:href="@{/grades/edit/{id}(id=${gradeEntry.gradeID})}" class="btn-edit">✏️ Edit</a>
                            <form th:action="@{/grades/delete/{id}(id=${gradeEntry.gradeID})}" method="post" style="display: inline;"
                                  onsubmit="return confirm('Are you sure you want to delete this grade?');">
                                <button type="submit" class="btn-delete">🗑️ Delete</button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
        
        <p class="data-count" th:text="'Total Grades: ' + ${grades.size()}"></p>
        
        <footer>
            <a href="/">← Back to Home</a>
        </footer>
    </div>
</body>
</html>
