<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Students - University Database</title>
    <link rel="stylesheet" type="text/css" th:href="@{/style.css}">
</head>
<body>
    <div class="container">
        <h1>👨‍🎓 Student List</h1>
        <p>All registered students in the system</p>
        
        <table>
            <thead>
                <tr>
                    <th>Student ID</th>
                    <th>Last Name</th>
                    <th>First Name</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="student : ${students}">
                    <td th:text="${#strings.substringBefore(student, ' ')}"></td>
                    <td th:text="${#strings.substringBefore(#strings.substringAfter(student, ' '), ' ')}"></td>
                    <td th:text="${#strings.substringAfter(#strings.substringAfter(student, ' '), ' ')}"></td>
                </tr>
            </tbody>
        </table>
        
        <p class="data-count" th:text="'Total Students: ' + ${students.size()}"></p>
        
        <footer>
            <a href="/">← Back to Home</a>
        </footer>
    </div>
</body>
</html>
