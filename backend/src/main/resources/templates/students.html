<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Students - University Database</title>
    <link rel="stylesheet" type="text/css" th:href="@{/style.css}">
</head>
<body>
    <div class="container">
        <h1>👨‍🎓 Student List</h1>
        <p>All registered students in the system</p>
        
        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
        
        <div class="crud-controls">
            <a href="/students/add" class="btn-add">➕ Add Student</a>
        </div>

        <div class="filter-section">
            <form class="filter-form" action="/students" method="get">
                <div>
                    <label>Filter by Name:</label>
                    <input type="text" name="search" placeholder="Enter name..." th:value="${param.search}">
                </div>
                <div>
                    <label>Filter by Major:</label>
                    <input type="text" name="major" placeholder="Enter major..." th:value="${param.major}">
                </div>
                <button type="submit" class="btn-filter">🔍 Filter</button>
                <a href="/students" class="btn-reset">↻ Reset</a>
            </form>
        </div>
        
        <table>
            <thead>
                <tr>
                    <th>Student ID</th>
                    <th>Last Name</th>
                    <th>First Name</th>
                    <th>Major</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="student : ${students}">
                    <td th:text="${student.studentID}"></td>
                    <td th:text="${student.lastName}"></td>
                    <td th:text="${student.firstName}"></td>
                    <td th:text="${student.major}"></td>
                    <td>
                        <div class="action-buttons">
                            <a th:href="@{/students/edit/{id}(id=${student.studentID})}" class="btn-edit">✏️ Edit</a>
                            <form th:action="@{/students/delete/{id}(id=${student.studentID})}" method="post" style="display: inline;" 
                                  onsubmit="return confirm('Are you sure you want to delete this student?');">
                                <button type="submit" class="btn-delete">🗑️ Delete</button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
        
        <p class="data-count" th:text="'Total Students: ' + ${students.size()}"></p>
        
        <footer>
            <a href="/">← Back to Home</a>
        </footer>
    </div>
</body>
</html>
