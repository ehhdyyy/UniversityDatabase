<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Students - University Database</title>
    <link rel="stylesheet" type="text/css" th:href="@{/style.css}">
</head>
<body>
    <div class="container">
        <h1>👨‍🎓 Student List</h1>
        <p>All registered students in the system</p>
        
        <ul>
            <li th:each="name : ${students}" th:text="${name}"></li>
        </ul>
        
        <p class="data-count" th:text="'Total Students: ' + ${students.size()}"></p>
        
        <footer>
            <a href="/">← Back to Home</a>
        </footer>
    </div>
</body>
</html>
