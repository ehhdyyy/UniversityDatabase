<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${section.sectionID == 0 ? 'Add Section' : 'Edit Section'}">Section Form</title>
    <link rel="stylesheet" type="text/css" th:href="@{/style.css}">
</head>
<body>
    <div class="container">
        <h1 th:text="${section.sectionID == 0 ? '➕ Add New Section' : '✏️ Edit Section'}">Section Form</h1>
        
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
        
        <div class="form-container">
            <form th:action="@{${section.sectionID == 0 ? '/sections/add' : '/sections/edit/' + section.sectionID}}" 
                  method="post" th:object="${section}">
                
                <div class="form-group">
                    <label for="courseID">Course:</label>
                    <select id="courseID" name="courseID" th:field="*{courseID}" required>
                        <option value="">Select a course...</option>
                        <option th:each="course : ${courses}" 
                                th:value="${course.courseID}" 
                                th:text="${course.courseID + ' - ' + course.courseName}">
                        </option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="dayTime">Schedule (Day & Time):</label>
                    <input type="text" id="dayTime" name="dayTime" th:value="*{dayTime}" 
                           placeholder="e.g., Mon-Wed 10:00-11:30" required>
                </div>
                
                <div class="form-group">
                    <label for="term">Term:</label>
                    <select id="term" name="term" th:field="*{term}" required>
                        <option value="">Select term...</option>
                        <option value="Fall 2024">Fall 2024</option>
                        <option value="Spring 2025">Spring 2025</option>
                        <option value="Spring 2026">Spring 2026</option>
                    </select>
                </div>
                
                <button type="submit" class="btn-submit" 
                        th:text="${section.sectionID == 0 ? 'Add Section' : 'Update Section'}">Submit</button>
                <a href="/sections" class="btn-cancel">Cancel</a>
            </form>
        </div>
        
        <footer>
            <a href="/sections">← Back to Sections</a>
        </footer>
    </div>
</body>
</html>
